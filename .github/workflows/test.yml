# Runs the designer's checks on every push to main and every pull request.
#
# Hermetic on a stock runner: plain Node, no dependencies, no npm install, no network, no secrets.
#   test/verify-core.js    the ported .NET Random + SharpNoise stay bit-exact vs references captured from the game DLLs
#   test/verify-water.js   imported lakes/rivers: runs the real imageToMaps (lifted out of src/designer.js) on a synthetic map
#   test/verify-shape.js   the same, on a COASTAL design: river mouths at the sea, and the shape of the ground beside a bank
#   test/verify-import.js  the legend decode in front of those: colour matching, the 12-colour cap, brightness mode
#   test/verify-paint.js   the HAND-PAINTED path instead: brush and fill on the torus, the height field, a painted river
#   test/verify-export.js  the bundle it all leaves in: the zip writer and its reader, the CRC, the design round trip
#   test/verify-search.js  src/search.js: the wrap-invariant similarity score that ranks every candidate seed
#   test/verify-memory.js  what one Find-mode candidate retains, and a pinned fingerprint of the world it makes
#   test/verify-pitch.js   no window inside imageToMaps may size itself from a hardcoded 120-chunk world
#   test/verify-highland.js a drawn highland comes out a range rather than a raised plateau
#   test/verify-ramp.js    the coastal ramp finishes at the same DISTANCE inland whatever the world size
#   test/verify-scale.js   a landform comes out the same size in blocks whatever the world size
# plus a build-sync check: index.html is a GENERATED artifact (build.js inlines src/* + WorldGenerator.eco into it) and
# GitHub Pages serves index.html straight from main — so a commit that edits src/ without rebuilding ships a live page
# that silently lacks the change. The check rebuilds and fails if the committed page differs from the sources.
#
# Note: Pages currently deploys from the branch (the "legacy" build), independent of this workflow — a red check does
# not stop the page updating. To gate deployment on green tests, switch Pages to "GitHub Actions" in the repo settings
# and deploy via actions/upload-pages-artifact + actions/deploy-pages behind `needs: test`. Until then, read the check
# before pushing to main.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless; don't pay for it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node 24: what the suites are developed against locally. No `cache:` — there is no lockfile to key it on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: node test/verify-core.js
      - run: node test/verify-water.js
      - run: node test/verify-shape.js
      - run: node test/verify-import.js
      - run: node test/verify-paint.js
      - run: node test/verify-export.js
      - run: node test/verify-search.js
      - run: node test/verify-seed.js
      - run: node test/verify-memory.js
      - run: node test/verify-pitch.js
      - run: node test/verify-highland.js
      - run: node test/verify-ramp.js
      - run: node test/verify-scale.js

      # A suite that exists but is not listed above runs only on the author's machine, which is where the
      # last four ended up. Cheap to check, and it fails the moment someone adds one without wiring it in.
      - name: every suite is wired into this workflow
        run: |
          missing=0
          for f in test/verify-*.js; do
            grep -qF "run: node $f" .github/workflows/test.yml || { echo "::error::$f is not run by this workflow"; missing=1; }
          done
          exit $missing

      - name: index.html is in sync with src/
        run: |
          node build.js
          git diff --stat --exit-code index.html || {
            echo '::error::index.html is stale — run `node build.js` and commit the result. GitHub Pages serves index.html, not src/.'
            exit 1
          }
